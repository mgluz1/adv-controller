name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Menor privilégio: o CI só lê o repositório. Nenhum segredo é usado (os testes rodam em PGlite, sem Neon).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright, sem banco)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O E2E usa o Google Chrome (channel "chrome"), já instalado nos runners ubuntu-latest.
      - run: npx playwright test --trace off
